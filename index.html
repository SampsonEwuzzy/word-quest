<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Quest – Developed for Diego & Winner</title>
<style>
:root{--ink:#2d3436;--card:#fff;--b1:#ffeaa7;--b2:#fab1a0;--b3:#a29bfe;--pur:#6c5ce7;--pink:#e84393;--bar:rgba(255,255,255,.88);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1f2f6;--card:#2f3542;--b1:#3d3b6b;--b2:#5b3a6b;--b3:#2c2f6b;--pur:#a29bfe;--bar:rgba(30,32,50,.88)}}
:root[data-theme="dark"]{--ink:#f1f2f6;--card:#2f3542;--b1:#3d3b6b;--b2:#5b3a6b;--b3:#2c2f6b;--pur:#a29bfe;--bar:rgba(30,32,50,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#fab1a0;background:linear-gradient(135deg,var(--b1),var(--b2),var(--b3));background-attachment:fixed}
#app{max-width:900px;margin:0 auto;padding:14px}
h1,h2{text-align:center;color:var(--pur);margin:.3em 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-around;background:var(--bar);border-radius:20px;padding:10px;font-weight:bold;font-size:1.05rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
button{font:inherit;font-weight:bold;color:#fff;border:4px solid transparent;border-radius:22px;padding:16px;font-size:1.2rem;cursor:pointer;background:var(--c1,#6c5ce7);transition:transform .1s}
button:hover:not(:disabled){border-color:#fff;transform:scale(1.03)}button:disabled{opacity:.9;cursor:default}
.c1{--c1:#e17055}.c2{--c1:#0984e3}.c3{--c1:#00b894}.c4{--c1:#f39c12}.c5{--c1:#6c5ce7}.c6{--c1:#e84393}.gray{--c1:#636e72;font-size:1rem;padding:10px 18px}
.card{background:var(--card);border:5px solid var(--bc,#74b9ff);border-radius:28px;padding:22px;text-align:center;margin:12px 0;font-size:1.3rem}
.big{font-size:2.6rem;font-weight:bold;color:var(--pink)}.hl{color:var(--pink);font-size:1.5em}
.center{text-align:center;margin:12px 0}.rules{text-align:center;font-weight:bold;margin:14px 0}
.opt.ok{--c1:#00b894!important}.opt.no{--c1:#d63031!important}
.prog{height:16px;background:var(--card);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#fd79a8,#fdcb6e);transition:width .3s}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tabs button{padding:10px 14px;font-size:1rem}
.fb{min-height:80px;text-align:center;font-size:1.15rem;margin:10px 0}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
</style></head><body><div id="app"></div>
<script>
const P={Diego:3,Winner:2},KEY="wordquest_v1",TITLES=["Word Explorer","Word Ranger","Word Wizard","Word Hero","Word Champion","Word Legend"];
const parse=t=>t.trim().split("\n").map(l=>l.split("|"));
const W2=parse(`brave|Adjective|not afraid of danger|The brave firefighter saved the kitten.
curious|Adjective|wanting to learn or know more|The curious boy opened the old box.
gentle|Adjective|soft and kind|Be gentle with the baby bird.
enormous|Adjective|very, very big|An enormous elephant walked by.
tiny|Adjective|very small|A tiny ant carried a crumb.
bright|Adjective|full of light or very colourful|The bright sun woke me up.
whisper|Verb|to speak very softly|Please whisper in the library.
gather|Verb|to bring things together|We gather shells at the beach.
explore|Verb|to travel to find new things|Let us explore the forest.
hurry|Verb|to move or act fast|We must hurry or we will be late.
pour|Verb|to make a liquid flow out|Mum will pour the juice.
treasure|Noun|gold, jewels or something precious|The pirates buried the treasure.
garden|Noun|a place where flowers or food grow|Dad planted beans in the garden.
journey|Noun|a long trip from one place to another|Our journey to the village was long.
island|Noun|land with water all around it|We sailed to a small island.
quickly|Adverb|in a fast way|The rabbit ran quickly home.`);
const W3=parse(`delighted|Adjective|very happy and pleased|She was delighted with her new book.
generous|Adjective|happy to give and share|The generous man shared his food.
ancient|Adjective|very, very old|We saw an ancient castle.
fragile|Adjective|easy to break|Be careful, the glass is fragile.
struggle|Verb|to try very hard to do something difficult|I struggle to lift the heavy bag.
observe|Verb|to watch carefully|Scientists observe the stars at night.
announce|Verb|to tell everyone something important|The teacher will announce the winner.
discover|Verb|to find something for the first time|Explorers discover new islands.
protect|Verb|to keep safe from harm|A helmet will protect your head.
invent|Verb|to make something new that never existed|Engineers invent useful machines.
adventure|Noun|an exciting and unusual experience|Our camping trip was a big adventure.
mystery|Noun|something strange that is hard to explain|The missing key is a mystery.
habitat|Noun|the natural home of an animal or plant|The forest is the habitat of many birds.
courage|Noun|being brave when you feel afraid|It took courage to speak on stage.
kingdom|Noun|a land ruled by a king or queen|The kingdom had a tall golden gate.
carefully|Adverb|in a way that avoids mistakes or harm|She carefully carried the eggs.
eagerly|Adverb|in a way that shows you really want something|The children eagerly opened their gifts.`);
const SENT=parse(`The dog barked loudly.|dog|Noun
My mother cooked rice.|mother|Noun
We visited the market.|market|Noun
Children play in the park.|play|Verb
She jumped over the log.|jumped|Verb
Birds fly in the sky.|fly|Verb
The red balloon floated away.|red|Adjective
We saw a tall giraffe.|tall|Adjective
She wore a beautiful dress.|beautiful|Adjective
The turtle walks slowly.|slowly|Adverb
He spoke quietly.|quietly|Adverb
She sings happily.|happily|Adverb
She likes to read.|She|Pronoun
They are my friends.|They|Pronoun
Give the book to him.|him|Pronoun
The cat sat on the mat.|on|Preposition
The ball rolled under the bed.|under|Preposition
The bird flew over the tree.|over|Preposition
I like tea and bread.|and|Conjunction
I was tired but happy.|but|Conjunction
Wear a coat because it is cold.|because|Conjunction`);
const G2=["Noun","Verb","Adjective","Adverb"],G3=[...G2,"Pronoun","Preposition","Conjunction"];
const INFO={Noun:["#e74c3c","🐶","A noun is a naming word. It names a person, animal, place or thing.","teacher, lion, Abuja, book","Can you see it, touch it, or name it? It is probably a noun!"],
Verb:["#27ae60","🏃","A verb is an action word. It tells what someone or something does.","run, jump, eat, sleep","If you can DO it, it is a verb!"],
Adjective:["#f39c12","🌈","An adjective is a describing word. It tells us more about a noun.","big, red, soft, happy","Adjectives answer: What kind? How many? Which one?"],
Adverb:["#8e44ad","🐢","An adverb tells HOW, WHEN or WHERE an action happens.","quickly, slowly, today, loudly","Many adverbs end in -ly!"],
Pronoun:["#2980b9","👆","A pronoun takes the place of a noun so we do not repeat it.","he, she, it, we, they","Instead of 'Ada is kind. Ada sings', say 'Ada is kind. She sings.'"],
Preposition:["#16a085","📍","A preposition shows where something is, or when something happens.","in, on, under, over, beside","Think of where a mouse can be: in, on, under the box!"],
Conjunction:["#d35400","🔗","A conjunction is a joining word. It joins words or sentences.","and, but, or, because, so","Conjunctions are like glue for sentences."],
Interjection:["#c0392b","😲","An interjection shows a sudden strong feeling. It often ends with '!'","Wow! Ouch! Hooray! Oh no!","Say it with feeling!"]};
const rec0=()=>({score:0,stars:0,rounds:0,correct:0,answered:0,best:0});
let D={};try{D=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
for(const n in P)D[n]=Object.assign(rec0(),D[n]||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
let me=null,view="pick",fc={},Q=null,les="Noun";const seen=new Set();
const $=document.getElementById("app");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=g=>g>=3?[...W2,...W3]:W2,lvl=s=>s/100|0+1,level=s=>(s/100|0)+1,title=s=>TITLES[Math.min(level(s)-1,5)];
const mk=(c,arr)=>{const o=shuf([c,...shuf([...new Set(arr)].filter(x=>x!==c)).slice(0,3)]);return{o,c:o.indexOf(c)}};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function build(mode){const g=P[me],pl=pool(g);let out=[];
 if(mode=="meaning")shuf(pl).slice(0,10).forEach(([w,p,m,s])=>out.push({q:`What does <span class="hl">${w}</span> mean?`,...mk(m,pl.map(x=>x[2])),ex:`<b>${w}</b> (${p}) means <i>${m}</i>.<br>“${s}”`}));
 else if(mode=="sentence")shuf(pl.filter(x=>new RegExp("\\b"+x[0]+"\\b","i").test(x[3]))).slice(0,10).forEach(([w,p,m,s])=>out.push({q:`Pick the missing word:<br>“${s.replace(new RegExp("\\b"+w+"\\b","i"),"_____")}”`,...mk(w,pl.map(x=>x[0])),ex:`Answer: <b>${w}</b> – ${m}.<br>“${s}”`}));
 else{const al=g>=3?G3:G2;shuf(SENT.filter(x=>al.includes(x[2]))).slice(0,10).forEach(([s,t,p])=>{const i=INFO[p];
  out.push({q:`What part of speech is the coloured word?<br>“${s.replace(new RegExp("\\b"+esc(t)+"\\b"),`<span class="hl">${t}</span>`)}”`,...mk(p,al),ex:`<b>${t}</b> is a <b style="color:${i[0]}">${p}</b> ${i[1]}<br>${i[2]}`})})}
 return out}
function add(d,a=0,c=0){const r=D[me];r.score=Math.max(0,r.score+d);r.answered+=a;r.correct+=c;save()}
const go=v=>{view=v;render()};
function start(mode){Q={mode,list:build(mode),i:0,streak:0,right:0,pts:0,ans:null,msg:"",done:false};go("quiz")}
function answer(k){if(Q.ans!==null)return;const q=Q.list[Q.i];Q.ans=k;let d;
 if(k==q.c){Q.streak++;Q.right++;d=10;Q.msg=`🎉 <span style="color:#00b894">Correct! +10</span>`;if(Q.streak%3==0){d+=5;Q.msg+=` 🔥 Streak bonus +5!`}}
 else{Q.streak=0;d=-5;Q.msg=`😅 <span style="color:#d63031">Oops! −5</span>`}
 Q.pts+=d;add(d,1,k==q.c?1:0);render()}
function next(){if(Q.i>=Q.list.length-1){const t=Q.list.length,a=Q.right/t,s=a>=.9?3:a>=.7?2:a>=.5?1:0,r=D[me];r.stars+=s;r.rounds++;r.best=Math.max(r.best,Q.pts);save();Q.stars=s;Q.done=true}else{Q.i++;Q.ans=null}render()}
function flash(){const c=fc.cards[fc.i],got=seen.has(c[0]);return`<div class="center">Card ${fc.i+1} of ${fc.cards.length}</div>
<div class="card"><div class="big">${c[0]}</div><div style="color:#0984e3">(${c[1]})</div><p>💡 ${c[2]}</p><p style="color:#00b894">“${c[3]}”</p></div>
<div class="grid"><button class="c1" onclick="fcMove(-1)">⬅ Back</button><button class="c4" ${got?"disabled":""} onclick="fcGot()">${got?"✅ Learned!":"⭐ Got it! (+2)"}</button><button class="c2" onclick="fcMove(1)">Next ➡</button></div>`}
function fcMove(s){fc.i=(fc.i+s+fc.cards.length)%fc.cards.length;render()}
function fcGot(){seen.add(fc.cards[fc.i][0]);add(2);render()}
function lesson(){const names=P[me]>=3?Object.keys(INFO):G2,i=INFO[les];
 return`<h2>🎨 Parts of Speech</h2><div class="tabs">${names.map(n=>`<button style="--c1:${INFO[n][0]}" onclick="les='${n}';render()">${INFO[n][1]} ${n}</button>`).join("")}</div>
<div class="card" style="--bc:${i[0]}"><div class="big" style="color:${i[0]}">${i[1]} ${les}</div><p>${i[2]}</p><p style="color:#0984e3">Examples: ${i[3]}</p><p style="color:#e17055">💡 ${i[4]}</p></div>`}
function quiz(){if(Q.done){const r=D[me],e=["💪","⭐","⭐⭐","🌟🌟🌟"][Q.stars],v=["Keep practising!","Good try!","Great job!","AMAZING!"][Q.stars];
 return`<div class="card pop"><div class="big">${e}</div><p>${v}</p><p>You got <b>${Q.right}/${Q.list.length}</b> right<br>Round points: <b>${Q.pts>=0?"+":""}${Q.pts}</b><br>Total score: <b>${r.score}</b></p></div><div class="grid"><button class="c3" onclick="start('${Q.mode}')">🔁 Play again</button></div>`}
 const q=Q.list[Q.i],cols=["c1","c2","c3","c4"];
 return`<div class="prog"><i style="width:${Q.i/Q.list.length*100}%"></i></div><div class="card">${q.q}</div>
<div class="grid">${q.o.map((o,k)=>`<button class="opt ${cols[k]} ${Q.ans!==null?(k==q.c?"ok":k==Q.ans?"no":""):""}" ${Q.ans!==null?"disabled":""} onclick="answer(${k})">${o}</button>`).join("")}</div>
<div class="fb">${Q.ans===null?`Question ${Q.i+1} of ${Q.list.length} | 🔥 Streak: ${Q.streak}`:`${Q.msg}<br><small>${q.ex}</small>`}</div>
${Q.ans!==null?`<div class="center"><button class="c2" onclick="next()">${Q.i>=Q.list.length-1?"🏁 See my result":"Next ➡"}</button></div>`:""}`}
function board(){const cl=["#74b9ff","#fd79a8"];return`<h2>🏆 Scoreboard</h2><div class="grid">${Object.keys(P).map((n,k)=>{const r=D[n],a=r.answered?Math.round(100*r.correct/r.answered):0;
 return`<div class="card" style="--bc:${cl[k]}"><b style="color:${cl[k]}">${n} (Grade ${P[n]})</b><p>${title(r.score)}<br>Level ${level(r.score)}</p><p>💰 Score: ${r.score}<br>⭐ Stars: ${r.stars}<br>🎮 Rounds: ${r.rounds}<br>🎯 Accuracy: ${a}%<br>🥇 Best round: ${r.best>=0?"+":""}${r.best}</p></div>`}).join("")}</div>
<div class="center"><button class="gray" onclick="if(confirm('Reset ALL scores for both children?')){for(const n in P)D[n]=rec0();save();render()}">Reset scores (parent)</button></div>`}
function render(){let h="";
 if(view=="pick"){h=`<h1>🌟 Word Quest 🌟</h1><h2>Who is playing today?</h2><div class="grid">${Object.keys(P).map((n,k)=>`<button class="c${k?6:2}" style="font-size:1.8rem;padding:30px" onclick="me='${n}';seen.clear();go('home')">${n}<br><small>Grade ${P[n]}</small></button>`).join("")}</div><p class="rules">💖 Developed for Diego &amp; Winner 💖</p>`}
 else{const r=D[me];h=`<div class="bar"><span>👤 ${me}</span><span>💰 ${r.score}</span><span>⭐ ${r.stars}</span><span>🎖 Lv ${level(r.score)} – ${title(r.score)}</span></div>`;
  if(view=="home")h+=`<h1>Hello, ${me}! 👋</h1><div class="grid">
<button class="c1" onclick="fc={cards:shuf(pool(P[me])),i:0};go('flash')">📖 Learn New Words</button><button class="c2" onclick="start('meaning')">🧠 Word Meaning Quiz</button>
<button class="c3" onclick="start('sentence')">✏️ Sentence Challenge</button><button class="c4" onclick="les='Noun';go('lesson')">🎨 Parts of Speech Lesson</button>
<button class="c5" onclick="start('pos')">🔍 Parts of Speech Game</button><button class="c6" onclick="go('score')">🏆 Scoreboard</button></div>
<p class="rules">✅ Correct +10 &nbsp; ❌ Wrong −5 &nbsp; 🔥 3 in a row +5 &nbsp; ⭐ Stars each round</p><div class="center"><button class="gray" onclick="go('pick')">🔄 Switch Player</button></div><p class="rules">💖 Developed for Diego &amp; Winner 💖</p>`;
  else{h+={flash,lesson,quiz,score:board}[view]();h+=`<div class="center"><button class="gray" onclick="go('home')">🏠 Home</button></div>`}}
 $.innerHTML=h;window.scrollTo(0,0)}
render();
</script></body></html>
