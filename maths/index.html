<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Quest – Developed for Diego & Winner</title>
<style>
:root{--ink:#2d3436;--card:#fff;--b1:#81ecec;--b2:#74b9ff;--b3:#a29bfe;--pur:#6c5ce7;--pink:#e84393;--bar:rgba(255,255,255,.88);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1f2f6;--card:#2f3542;--b1:#1d4b5b;--b2:#1f3a6b;--b3:#2c2f6b;--pur:#a29bfe;--bar:rgba(30,32,50,.88)}}
:root[data-theme="dark"]{--ink:#f1f2f6;--card:#2f3542;--b1:#1d4b5b;--b2:#1f3a6b;--b3:#2c2f6b;--pur:#a29bfe;--bar:rgba(30,32,50,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#74b9ff;background:linear-gradient(135deg,var(--b1),var(--b2),var(--b3));background-attachment:fixed}
#app{max-width:900px;margin:0 auto;padding:14px}
h1,h2{text-align:center;color:var(--pur);margin:.3em 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-around;background:var(--bar);border-radius:20px;padding:10px;font-weight:bold;font-size:1.05rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
button{font:inherit;font-weight:bold;color:#fff;border:4px solid transparent;border-radius:22px;padding:16px;font-size:1.2rem;cursor:pointer;background:var(--c1,#6c5ce7);transition:transform .1s}
button:hover:not(:disabled){border-color:#fff;transform:scale(1.03)}button:disabled{opacity:.9;cursor:default}
.c1{--c1:#e17055}.c2{--c1:#0984e3}.c3{--c1:#00b894}.c4{--c1:#f39c12}.c5{--c1:#6c5ce7}.c6{--c1:#e84393}.gray{--c1:#636e72;font-size:1rem;padding:10px 18px}
.card{background:var(--card);border:5px solid var(--bc,#a29bfe);border-radius:28px;padding:22px;text-align:center;margin:12px 0;font-size:1.4rem}
.big{font-size:2.6rem;font-weight:bold;color:var(--pink)}.q{font-size:2.2rem;font-weight:bold}
.center{text-align:center;margin:12px 0}.rules{text-align:center;font-weight:bold;margin:14px 0}
.opt{font-size:1.8rem}.opt.ok{--c1:#00b894!important}.opt.no{--c1:#d63031!important}
.prog{height:16px;background:var(--card);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#fd79a8,#fdcb6e);transition:width .3s}
.fb{min-height:80px;text-align:center;font-size:1.15rem;margin:10px 0}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
a.lnk{display:block;width:fit-content;margin:16px auto;background:#e84393;color:#fff;padding:12px 24px;border-radius:22px;font-weight:bold;text-decoration:none;font-size:1.1rem}a.lnk:hover{outline:4px solid #fff}
</style></head><body><div id="app"></div>
<script>
const P={Diego:3,Winner:2},KEY="mathsquest_v1",TITLES=["Number Explorer","Number Ranger","Number Wizard","Number Hero","Number Champion","Number Legend"];
const NAMES=["Ada","Chidi","Bola","Musa","Ngozi","Tunde","Amina","Emeka"],ITEMS=["mangoes","oranges","pencils","books","eggs","sweets"];
const MODES={add:["➕ Addition","c1"],sub:["➖ Subtraction","c2"],mul:["✖️ Times Tables","c3"],div:["➗ Division","c4"],word:["📖 Word Problems","c5"],mix:["🎲 Mixed Challenge","c6"]};
const rec0=()=>({score:0,stars:0,rounds:0,correct:0,answered:0,best:0});
let D={};try{D=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
for(const n in P)D[n]=Object.assign(rec0(),D[n]||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
let me=null,view="pick",Q=null;const $=document.getElementById("app");
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const level=s=>(s/100|0)+1,title=s=>TITLES[Math.min(level(s)-1,5)];
function opts(c,step){const near=[c+1,c-1,c+2,c-2,c+10,c-10,c+step,c-step].filter(x=>x>=0&&x!==c);
 const o=shuf([c,...shuf([...new Set(near)]).slice(0,3)]);return{o,c:o.indexOf(c)}}
function gen(mode,g){if(mode=="mix")mode=pick(["add","sub","mul","div","word"]);let q,a,ex,step=10;
 const tabs=g>=3?[2,3,4,5,6,7,8,9,10]:[2,3,4,5,10];
 if(mode=="add"){const x=g>=3?R(100,600):R(10,60),y=g>=3?R(100,390):R(10,40);a=x+y;q=`${x} + ${y} = ?`;ex=`${x} + ${y} = <b>${a}</b>. Add the ones first, then the tens${g>=3?", then the hundreds":""}.`}
 else if(mode=="sub"){const x=g>=3?R(300,999):R(30,99),y=g>=3?R(100,x-50):R(10,x-5);a=x-y;q=`${x} − ${y} = ?`;ex=`${x} − ${y} = <b>${a}</b>. Check: ${a} + ${y} = ${x}.`}
 else if(mode=="mul"){const m=pick(tabs),n=R(1,g>=3?12:10);a=m*n;step=m;q=`${m} × ${n} = ?`;ex=`${m} × ${n} = <b>${a}</b>. That is ${n} groups of ${m}.`}
 else if(mode=="div"){const m=pick(tabs),n=R(1,10);a=n;step=1;q=`${m*n} ÷ ${m} = ?`;ex=`${m*n} ÷ ${m} = <b>${n}</b> because ${m} × ${n} = ${m*n}.`}
 else{const t=pick(["add","sub","mul","div"]),nm=pick(NAMES),it=pick(ITEMS);
  if(t=="add"){const x=g>=3?R(120,500):R(12,50),y=g>=3?R(100,400):R(10,40);a=x+y;q=`${nm} has ${x} ${it}. A friend gives ${y} more. How many ${it} now?`;ex=`${x} + ${y} = <b>${a}</b>.`}
  else if(t=="sub"){const x=g>=3?R(300,900):R(30,90),y=R(10,x-5);a=x-y;q=`${nm} had ₦${x}. ${nm} spent ₦${y}. How much is left?`;ex=`${x} − ${y} = <b>₦${a}</b>.`}
  else if(t=="mul"){const m=pick(tabs),n=R(2,g>=3?10:5);a=m*n;step=m;q=`There are ${m} bags. Each bag has ${n} ${it}. How many ${it} in all?`;ex=`${m} × ${n} = <b>${a}</b>.`}
  else{const k=pick(tabs.filter(x=>x<=6)),n=R(2,8);a=n;step=1;q=`${nm} shares ${k*n} ${it} equally among ${k} children. How many does each child get?`;ex=`${k*n} ÷ ${k} = <b>${n}</b>.`}}
 return{q,...opts(a,step),ex}}
const build=m=>Array.from({length:10},()=>gen(m,P[me]));
function add(d,a=0,c=0){const r=D[me];r.score=Math.max(0,r.score+d);r.answered+=a;r.correct+=c;save()}
const go=v=>{view=v;render()};
function start(mode){Q={mode,list:build(mode),i:0,streak:0,right:0,pts:0,ans:null,msg:"",done:false};go("quiz")}
function answer(k){if(Q.ans!==null)return;const q=Q.list[Q.i];Q.ans=k;let d;
 if(k==q.c){Q.streak++;Q.right++;d=10;Q.msg=`🎉 <span style="color:#00b894">Correct! +10</span>`;if(Q.streak%3==0){d+=5;Q.msg+=` 🔥 Streak bonus +5!`}}
 else{Q.streak=0;d=-5;Q.msg=`😅 <span style="color:#d63031">Oops! −5</span>`}
 Q.pts+=d;add(d,1,k==q.c?1:0);render()}
function next(){if(Q.i>=Q.list.length-1){const a=Q.right/Q.list.length,s=a>=.9?3:a>=.7?2:a>=.5?1:0,r=D[me];r.stars+=s;r.rounds++;r.best=Math.max(r.best,Q.pts);save();Q.stars=s;Q.done=true}else{Q.i++;Q.ans=null}render()}
function quiz(){if(Q.done){const r=D[me],e=["💪","⭐","⭐⭐","🌟🌟🌟"][Q.stars],v=["Keep practising!","Good try!","Great job!","AMAZING!"][Q.stars];
 return`<div class="card pop"><div class="big">${e}</div><p>${v}</p><p>You got <b>${Q.right}/${Q.list.length}</b> right<br>Round points: <b>${Q.pts>=0?"+":""}${Q.pts}</b><br>Total score: <b>${r.score}</b></p></div><div class="grid"><button class="c3" onclick="start('${Q.mode}')">🔁 Play again</button></div>`}
 const q=Q.list[Q.i],cols=["c1","c2","c3","c4"];
 return`<h2>${MODES[Q.mode][0]}</h2><div class="prog"><i style="width:${Q.i/Q.list.length*100}%"></i></div><div class="card"><div class="${q.q.length<20?"q":""}">${q.q}</div></div>
<div class="grid">${q.o.map((o,k)=>`<button class="opt ${cols[k]} ${Q.ans!==null?(k==q.c?"ok":k==Q.ans?"no":""):""}" ${Q.ans!==null?"disabled":""} onclick="answer(${k})">${o}</button>`).join("")}</div>
<div class="fb">${Q.ans===null?`Question ${Q.i+1} of ${Q.list.length} | 🔥 Streak: ${Q.streak}`:`${Q.msg}<br><small>${q.ex}</small>`}</div>
${Q.ans!==null?`<div class="center"><button class="c2" onclick="next()">${Q.i>=Q.list.length-1?"🏁 See my result":"Next ➡"}</button></div>`:""}`}
function board(){const cl=["#74b9ff","#fd79a8"];return`<h2>🏆 Scoreboard</h2><div class="grid">${Object.keys(P).map((n,k)=>{const r=D[n],a=r.answered?Math.round(100*r.correct/r.answered):0;
 return`<div class="card" style="--bc:${cl[k]}"><b style="color:${cl[k]}">${n} (Grade ${P[n]})</b><p>${title(r.score)}<br>Level ${level(r.score)}</p><p>💰 Score: ${r.score}<br>⭐ Stars: ${r.stars}<br>🎮 Rounds: ${r.rounds}<br>🎯 Accuracy: ${a}%<br>🥇 Best round: ${r.best>=0?"+":""}${r.best}</p></div>`}).join("")}</div>
<div class="center"><button class="gray" onclick="if(confirm('Reset ALL scores for both children?')){for(const n in P)D[n]=rec0();save();render()}">Reset scores (parent)</button></div>`}
function render(){let h="";
 if(view=="pick"){h=`<h1>🔢 Maths Quest 🔢</h1><h2>Who is playing today?</h2><div class="grid">${Object.keys(P).map((n,k)=>`<button class="c${k?6:2}" style="font-size:1.8rem;padding:30px" onclick="me='${n}';go('home')">${n}<br><small>Grade ${P[n]}</small></button>`).join("")}</div><a class="lnk" href="../">📖 Try Word Quest ➡</a><p class="rules">💖 Developed for Diego &amp; Winner 💖</p>`}
 else{const r=D[me];h=`<div class="bar"><span>👤 ${me}</span><span>💰 ${r.score}</span><span>⭐ ${r.stars}</span><span>🎖 Lv ${level(r.score)} – ${title(r.score)}</span></div>`;
  if(view=="home")h+=`<h1>Hello, ${me}! 👋</h1><div class="grid">${Object.keys(MODES).map(m=>`<button class="${MODES[m][1]}" onclick="start('${m}')">${MODES[m][0]}</button>`).join("")}<button class="c6" style="--c1:#fd79a8" onclick="go('score')">🏆 Scoreboard</button></div>
<p class="rules">✅ Correct +10 &nbsp; ❌ Wrong −5 &nbsp; 🔥 3 in a row +5 &nbsp; ⭐ Stars each round</p><div class="center"><button class="gray" onclick="go('pick')">🔄 Switch Player</button></div><a class="lnk" href="../">📖 Try Word Quest ➡</a><p class="rules">💖 Developed for Diego &amp; Winner 💖</p>`;
  else{h+={quiz,score:board}[view]();h+=`<div class="center"><button class="gray" onclick="go('home')">🏠 Home</button></div>`}}
 $.innerHTML=h;window.scrollTo(0,0)}
render();
</script></body></html>
